version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: chatvector-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - chatvector-db-data-prod:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: chatvector-redis
    restart: always
    volumes:
      - chatvector-redis-data-prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  api:
    build:
      context: ./backend
    # No fixed container_name. A second replica needs its own host port (or a
    # load balancer): `8000:8000` cannot be published twice. Set
    # MULTI_API_INSTANCE=true and ARTIFACT_STORAGE=s3 before running replicas.
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_ENV: production

      GEN_AI_KEY: ${GEN_AI_KEY}

      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_MODEL: ${LLM_MODEL}

      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}

      QUEUE_BACKEND: ${QUEUE_BACKEND:-redis}
      QUEUE_WORKER_COUNT: ${QUEUE_WORKER_COUNT:-3}
      MULTI_API_INSTANCE: ${MULTI_API_INSTANCE:-false}
      TENANT_REGISTRY_DISABLED: ${TENANT_REGISTRY_DISABLED:-}
      ARTIFACT_STORAGE: ${ARTIFACT_STORAGE:-local}
      ARTIFACT_S3_BUCKET: ${ARTIFACT_S3_BUCKET:-}
      ARTIFACT_S3_ENDPOINT_URL: ${ARTIFACT_S3_ENDPOINT_URL:-}
      ARTIFACT_S3_REGION: ${ARTIFACT_S3_REGION:-us-east-1}
      ARTIFACT_S3_ACCESS_KEY: ${ARTIFACT_S3_ACCESS_KEY:-}
      ARTIFACT_S3_SECRET_KEY: ${ARTIFACT_S3_SECRET_KEY:-}
      ARTIFACT_S3_PREFIX: ${ARTIFACT_S3_PREFIX:-chatvector/artifacts/}

      LOG_FORMAT: JSON
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PYTHONPATH: /app

    working_dir: /app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]

    deploy:
      resources:
        limits:
          memory: 1g

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
volumes:
  chatvector-db-data-prod:
  chatvector-redis-data-prod:
